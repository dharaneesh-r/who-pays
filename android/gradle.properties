org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Gradle's file-system watching keeps native file handles open on Windows.
# When a build is interrupted, those handles outlive it and the next build
# dies with "classes.dex: The process cannot access the file because it is
# being used by another process" during R8. Turning the watcher off costs a
# little incremental-build speed and removes that failure entirely.
org.gradle.vfs.watch=false

# One daemon, not a new one per JVM-arg variation. Several daemons racing for
# the same build directory is the other way this lock shows up.
org.gradle.daemon=true
org.gradle.parallel=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
