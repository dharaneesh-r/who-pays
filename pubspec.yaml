name: who_pays
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_confetti: ^0.9.2
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  path_provider_android: ">=2.2.5 <2.3.0"
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  vibration: ^3.1.8
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/cards/

  fonts:
    # Bundled, not fetched: without these the app inherits each phone's system
    # font and looks different on every device.
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0E0E12"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
