<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E12">
<title>Who Pays?</title>
<style>
  :root {
    --bg: #0E0E12;
    --surface: #1A1A21;
    --accent: #FFB300;
    --danger: #E53935;
    --safe: #43A047;
    --text: #FFFFFF;
    --muted: rgba(255, 255, 255, 0.55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh; text-align: center;
  }
  h1 { font-size: 15px; letter-spacing: 4px; color: var(--accent); margin: 0 0 auto; font-weight: 800; }
  .mid { margin: auto 0; }
  .clock {
    font-size: 72px; font-weight: 800; letter-spacing: -2px;
    font-variant-numeric: tabular-nums; margin: 8px 0;
  }
  .state { font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; }
  .state.settling { color: var(--accent); }
  .state.armed { color: var(--safe); }
  .state.caught { color: var(--danger); }
  .muted { color: var(--muted); font-size: 15px; line-height: 1.45; }
  input, button {
    width: 100%; font-size: 17px; font-family: inherit;
    border-radius: 14px; border: 1px solid rgba(255,255,255,.18);
    padding: 16px; margin-top: 10px; background: var(--surface); color: var(--text);
  }
  input { text-align: center; }
  #code { text-transform: uppercase; letter-spacing: 10px; font-size: 32px; font-weight: 800; }
  button {
    background: var(--accent); color: #140F00; border: none;
    font-weight: 800; letter-spacing: .5px;
  }
  button[disabled] { opacity: .45; }
  ul { list-style: none; padding: 0; margin: 18px 0 0; text-align: left; }
  li { display: flex; align-items: center; gap: 10px; padding: 7px 2px; font-size: 16px; }
  li.out { color: var(--muted); text-decoration: line-through; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--safe); flex: none; }
  li.out .dot { background: var(--danger); }
  .grow { flex: 1; }
  .err { color: var(--danger); font-size: 15px; margin-top: 10px; min-height: 20px; }
  .foot { color: rgba(255,255,255,.3); font-size: 13px; margin-top: auto; padding-top: 20px; }
  .hidden { display: none !important; }
  button.link {
    background: none; color: var(--muted); border: none;
    font-size: 15px; font-weight: 400; margin-top: 22px;
  }
</style>
</head>
<body>
  <h1>WHO PAYS?</h1>

  <!-- Join -->
  <section id="join" class="mid">
    <p class="muted">Put your phone face down.<br>First one to pick it up pays.</p>
    <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <input id="name" maxlength="24" placeholder="Your name" autocomplete="name">
    <button id="joinBtn">JOIN THE TABLE</button>
    <div id="joinErr" class="err"></div>
  </section>

  <!-- Lobby -->
  <section id="lobby" class="mid hidden">
    <p class="muted">You're in. Waiting for the host to start…</p>
    <ul id="lobbyList"></ul>
  </section>

  <!-- Round -->
  <section id="round" class="mid hidden">
    <div id="state" class="state settling">PUT IT DOWN</div>
    <div id="clock" class="clock">00:00</div>
    <div id="hint" class="muted">Hold still — the round starts when your phone settles</div>
    <ul id="roundList"></ul>
    <!-- A browser cannot see a screen unlock, so its detection is weaker than
         the app's. Without a way to admit defeat, a guest whose pick-up went
         undetected has no way to stay honest. -->
    <button id="giveUp" class="link">I give up — I pay</button>
  </section>

  <p class="foot">No app needed. Keep this page open.</p>

  <!-- Absolute, not relative: this page is also served at /j/CODE, where a
       relative src would resolve to /j/app.js and 404. -->
  <script type="module" src="/app.js"></script>
</body>
</html>
