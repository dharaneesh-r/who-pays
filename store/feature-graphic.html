<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap">
<style>
  /* Play feature graphic: exactly 1024x500. Rendered here so the fonts match
     the app rather than being approximated in an image editor. */
  html,body{margin:0;padding:0;background:#0E0E12}
  .card{
    width:1024px;height:500px;position:relative;overflow:hidden;
    background:
      radial-gradient(900px 420px at 86% 52%, rgba(255,179,0,.16), transparent 62%),
      #0E0E12;
    display:flex;align-items:center;
  }
  .copy{padding-left:64px;max-width:600px;z-index:2}
  h1{
    font-family:Anton,Impact,sans-serif;color:#F5EFE3;
    font-size:104px;line-height:.92;margin:0;letter-spacing:1px;
  }
  h1 em{font-style:normal;color:#FFB300}
  p{
    font-family:Inter,sans-serif;color:#B9B9C4;font-size:25px;
    margin:22px 0 0;line-height:1.35;font-weight:400;
  }
  .phones{position:absolute;right:62px;top:0;height:500px;width:380px}
  /* Three phones face down on a table; the nearest one is being lifted. */
  .p{
    position:absolute;border-radius:22px;background:#FFB300;
    box-shadow:0 18px 40px rgba(0,0,0,.5);
  }
  .p::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    top:18px;width:46%;height:13px;border-radius:7px;background:#140F00;
  }
  .p1{width:116px;height:186px;left:18px;top:168px;transform:rotate(-13deg)}
  .p2{width:116px;height:186px;left:132px;top:142px;transform:rotate(5deg)}
  .p3{width:124px;height:198px;left:242px;top:96px;transform:rotate(17deg)}
  .alarm{
    position:absolute;right:28px;top:66px;width:84px;height:84px;
    border-radius:50%;background:#E5392F;border:9px solid #0E0E12;z-index:3;
  }
  .alarm span{
    position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-family:Anton,sans-serif;color:#fff;font-size:46px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <h1>WHO<br><em>PAYS?</em></h1>
      <p>Phones face down. First one to pick up<br>buys the next round.</p>
    </div>
    <div class="phones">
      <div class="p p1"></div>
      <div class="p p2"></div>
      <div class="p p3"></div>
      <div class="alarm"><span>!</span></div>
    </div>
  </div>
</body>
</html>
